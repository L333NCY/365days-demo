<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>365DAYS Demo</title>

<style>
body{
  margin:0;
  background:#080c13;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

header{
  background:#111722;
  padding:20px;
  border-bottom:1px solid #293242;
}

.logo{
  font-size:32px;
  font-weight:bold;
}

.logo span{
  color:#e53935;
}

main{
  max-width:900px;
  margin:40px auto;
  padding:20px;
}

.card{
  background:#111722;
  border:1px solid #293242;
  border-radius:15px;
  padding:25px;
  margin:15px 0;
}

button{
  background:#e53935;
  color:white;
  border:0;
  padding:12px 25px;
  border-radius:8px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <div class="logo">365<span>DAYS</span></div>
</header>

<main>

<div class="card">
  <h1>Mirë se vini në 365DAYS</h1>
  <p>Sportsbook Demo</p>
  <button>DEMO</button>
</div>

<div class="card">
  <h2>⚽ Ndeshjet e sotme</h2>
  <p>Manchester City — Liverpool</p>
  <p>2.05 &nbsp; | &nbsp; 3.60 &nbsp; | &nbsp; 3.10</p>
</div>

<div class="card">
  <h2>🎫 Kuponi</h2>
  <p>Balancë virtuale: €1,000</p>
</div>

</main>

</body>
</html>
